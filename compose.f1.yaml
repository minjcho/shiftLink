name: shiftlink-f1
services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_DB: shiftlink
      POSTGRES_USER: shiftlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development database password}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - f1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftlink -d shiftlink"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  f1-data:
