[project]
name = "shiftlink-f1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "openai>=1.65,<3",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests/backend", "apps/api/tests/actions"]
pythonpath = ["apps/api"]
addopts = "--strict-markers"
markers = [
  "ac1", "ac2", "ac3", "ac4", "ac5", "ac6", "ac7", "ac8", "ac9",
  "ac10", "ac11", "ac12", "ac13", "ac14", "ac15", "ac16", "ac17",
  "ac18", "ac19", "ac20", "ac21", "ac22", "ac23", "ac24", "ac25",
  "ac26", "ac27", "ac28", "ac29", "ac30", "ac31", "ac32", "ac33", "ac34",
]
